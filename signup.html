<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - FAMILY STUDIO</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#222;
  padding:30px;
  border-radius:10px;
  width:320px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:5px;
}

button{
  width:100%;
  padding:12px;
  background:#d40000;
  color:white;
  border:none;
  border-radius:5px;
  font-size:16px;
}

a{
  color:#ff4444;
}
</style>
</head>

<body>

<div class="box">
<h2>Create Account</h2>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Create Account</button>

<p style="text-align:center;">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
