<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FAMILY STUDIO ADMIN</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
padding:20px;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
font-size:18px;
}
</style>
</head>

<body>

<h1>🎬 FAMILY STUDIO ADMIN</h1>

<input id="title" placeholder="Movie Title">

<input id="image" placeholder="Poster Image URL">

<input id="video" placeholder="Movie Video URL">

<textarea id="desc" placeholder="Movie Description"></textarea>

<button>Add Movie</button>

</body><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrPx2Am0xbAqXbwLFAte5EPUSgldz-Vow",
  authDomain: "family-studio-bfafa.firebaseapp.com",
  projectId: "family-studio-bfafa",
  storageBucket: "family-studio-bfafa.firebasestorage.app",
  messagingSenderId: "10850848181",
  appId: "1:10850848181:web:73b0f52fe26b6784ec1dfc",
  measurementId: "G-XKXBSTME05"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.querySelector("button").onclick = async () => {

  const title = document.getElementById("title").value;
  const image = document.getElementById("image").value;
  const video = document.getElementById("video").value;
  const description = document.getElementById("desc").value;

  await addDoc(collection(db, "movies"), {
    title,
    image,
    video,
    description
  });

  alert("Movie added successfully!");
};

</script>
</html>
