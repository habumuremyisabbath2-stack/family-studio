<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Movie</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

video{
width:100%;
max-width:900px;
margin-top:20px;
}

a{
display:inline-block;
margin:20px;
padding:12px 25px;
background:red;
color:white;
text-decoration:none;
border-radius:5px;
}
</style>

</head>

<body>

<h1>🎬 Watch Movie</h1>

<video id="player" controls></video>

<br>

<a id="download" download>⬇ Download Movie</a>

<script>
const params = new URLSearchParams(window.location.search);

const video = params.get("video");

document.getElementById("player").src = video;
document.getElementById("download").href = video;
</script>

</body>
</html>
